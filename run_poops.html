<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hassoun&Gaming</title>
<style>
  /* إعدادات الشاشة الكاملة والخلفية */
  html, body { 
    margin:0; 
    padding:0; 
    background: url('preview.png') no-repeat center center fixed; 
    background-size: cover;
    color:#97b4de;
    font-family: 'Arial Black', 'Impact', 'Segoe UI', sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  /* حاوية المحتوى الرئيسي */
  #main-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    box-sizing: border-box;
    padding: 20px 30px;
  }

  /* الهيدر العلوي: شفاف تماماً وبخط ضخم جداً وعريض */
  #brand { 
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 0;
    background: transparent !important; 
    border: none !important;
    margin-bottom: 20px;
  }
  #brand img { 
    width: 48px; 
    height: 48px; 
    margin-bottom: 8px; 
    border-radius: 50%;
    box-shadow: 0 0 15px rgba(255,255,255,0.3);
  }
  
  /* السطر الأول (الاسم باللون الأحمر) */
  #brand .title-main { 
    font-size: 35px !important; 
    font-weight: 900; 
    text-transform: uppercase;
    color: #f50707; 
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 4px 8px rgba(0,0,0,0.9);
    margin: 0;
  }

  /* السطر الثاني (الرقم باللون الأزرق) */
  #brand .title-sub {
    font-size: 28px !important; 
    font-weight: 900;
    color: #071ff5; 
    text-shadow: 0 0 8px rgba(255, 215, 64, 0.4), 0 2px 5px rgba(0,0,0,0.9);
    margin-top: 4px; 
  }

  /* حاوية التغليف المحمية والمطلوبة برمجياً لملف الـ JS */
  #wrap {
    display: flex;
    flex-direction: column;
    flex: 1;
    overflow: hidden;
  }

  /* التفاصيل والتعليمات */
  #details { 
    font-size: 16px; 
    color: #29374d; 
    margin-bottom: 15px; 
    text-align: center;
    font-weight: bold;
    text-shadow: 0 2px 5px rgba(0,0,0,0.9);
  }
  #details b { color: #b36b24; font-weight: 900; }

  /* حالة النظام الحالية بتأثير النيون المتوهج */
  #state { 
    font-size: 26px; 
    font-weight: 900; 
    margin-bottom: 20px; 
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(255, 215, 64, 0.6);
  }

  /* لوحة إخراج الأكواد: حجم 9.5px */
  #out { 
    flex: 1;
    white-space: pre-wrap; 
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 9.5px; 
    line-height: 1.35; 
    background: rgba(10, 14, 23, 0.25); 
    border: 1px solid rgba(255, 255, 255, 0.12); 
    border-radius: 12px;
    padding: 15px 20px; 
    overflow-y: auto; 
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8);
    margin-bottom: 10px;
  }

  /* ألوان الحالات المتوهجة للأكواد */
  .ok { color: #69f0ae; text-shadow: 0 0 8px rgba(105,240,174,0.5); } 
  .bad { color: #ff5252; text-shadow: 0 0 8px rgba(255,82,82,0.5); } 
  .warn { color: #ffd740; text-shadow: 0 0 8px rgba(255,215,64,0.5); }
</style>
</head>
<body>

<div id="main-container">
  <div id="brand">
    <img src="logo_raw.png" alt="" width="48" height="48">
    <div class="title-main">Hassoun & Gaming</div>
    <div class="title-sub">0123783040</div>
  </div>

  <div id="wrap">
    <div id="state" class="warn">loading poops chain...</div>
    <div id="details">حالة المتصفح: يرجى الانتظار حتى يتم تحميل المكونات وتفعيل ثغرة الـ <b>Poops</b> تلقائياً.</div>
    <div id="out"></div>
  </div>
</div>

<!-- كود الفحص والمراقبة الجديد المدمج بطريقة آمنة لمتصفح الـ PS4 -->
<script>
  // 1. فحص فوري قبل تشغيل الثغرة لتغيير النص إذا كانت مفعّلة مسبقاً
  if (localStorage.getItem("ps4_poops_done") === "true") {
      document.getElementById("state").innerHTML = "GOLDHEN ALREADY ACTIVE";
      document.getElementById("state").className = "ok";
      document.getElementById("details").innerHTML = "تنبيه: <b style='color:#69f0ae;'>تم تفعيل الجيلبريك بنجاح بالفعل!</b> يمكنك الخروج وتشغيل ألعابك.";
      document.getElementById("out").innerHTML = "<span class='ok'>[INFO] Exploit already executed successfully inside this session.\n[INFO] No need to run again. Press PS Button to exit.</span>";
  }

  // 2. مراقبة ذكية لصندوق المخرجات لحفظ النجاح فور ظهور عبارة التفعيل النهائية
  var outBox = document.getElementById("out");
  if (outBox) {
      var checkObserver = new MutationObserver(function() {
          var text = outBox.innerText.toLowerCase();
          if (text.includes("all done") || text.includes("success") || text.includes("goldhen launched")) {
              localStorage.setItem("ps4_poops_done", "true");
          }
      });
      checkObserver.observe(outBox, { childList: true, characterData: true, subtree: true });
  }
</script>
  
<!-- استدعاء ملف الثغرة الأصلي بأمان (لن يتعطل الآن) -->
<script type="module">
  // لا نقوم بعمل import إذا كان التفعيل مخزن مسبقاً لحماية المتصفح من الانهيار
  if (localStorage.getItem("ps4_poops_done") !== "true") {
      import "./chain_poops.js";
  }
</script>
</body>
</html>
