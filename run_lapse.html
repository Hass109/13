<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hassoun&Gaming</title>
<style>
  /* تم تعديل الخلفية هنا لعرض الصورة بشكل كامل ومثبت */
  html, body { 
    margin:0; 
    padding:0; 
    background: url('preview.png') no-repeat center center fixed; 
    background-size: cover;
    color:#c8ced8;
    font:15px/1.45 "Segoe UI", system-ui, sans-serif; 
    height: 100vh;
  }
  #wrap { padding:16px 18px; }
  #state { font-size:22px; font-weight:700; margin:0 0 10px; }
  
  /* ستايل مخصص لسطر التفاصيل الجديد */
  #details { font-size:14px; color:#8b95a3; margin:-5px 0 15px; }
  #details b { color:#7fd0a0; } /* لون أخضر خفيف للكلمات المهمة */

  /* تعديل صندوق النصوص ليصبح شبه شفاف وخلفيته داكنة ومريحة للعين */
  #out { white-space:pre-wrap; font:12px/1.45 Consolas, monospace;
         background: rgba(17, 21, 27, 0.85); 
         border:1px solid #1e2732; border-radius:5px;
         padding:10px 12px; height:calc(100vh - 170px); overflow-y:auto; 
         box-shadow: 0 4px 15px rgba(0,0,0,0.4);
  }
  .ok { color:#7fd0a0; } .bad { color:#d08a7f; } .warn { color:#d8c07f; }
  
  /* تعديل الهيدر العلوي: تم إزالة الخلفية والحدود وتكبير الخط */
  #brand { 
    text-align:center; 
    padding:15px 10px 5px; /* زيادة مسافة الحشو العلوية */
    background: transparent; /* جعل الخلفية شفافة بالكامل */
    border-bottom: none; /* إزالة الخط السفلي */
  }
  #brand img { 
    width:32px; /* تكبير بسيط للشعار ليتناسق مع الخط الجديد */
    height:32px; 
    margin-right:8px; 
    border-radius:50%;
    vertical-align:middle; 
  }
  #brand b { 
    font-size:18px; /* تكبير حجم خط النص هنا */
    font-weight:700; 
    letter-spacing:.14em;
    color:#e6ebf2; 
    vertical-align:middle; 
  }
</style>
</head>
<body>
<!-- السطر المطلوب تعديله أصبح الآن شفافاً وبخط أكبر -->
<div id="brand"><img src="logo_raw.png" alt="" width="32" height="32"><b>Hassoun&Gaming-0123783040</b></div>
<div id="wrap">
  <div id="state">loading poops chain...</div>
  <!-- السطر الجديد المضاف أسفل السطر السابق لكتابة تفاصيلك المخصصة -->
  <div id="details">تنبيه: لا تقم بإغلاق هذه الصفحة أو الضغط على أي زر حتى يتم <b>lapse تفعيل بنجااح</b>.</div>
  <div id="out"></div>
</div>
<script type="module">import "./chain_lapse.js";</script>
</body>
</html>
